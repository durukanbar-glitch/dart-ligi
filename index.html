<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dart ELO Canlı Ligi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <div class="max-w-md mx-auto px-4 pt-6">
        
        <div class="flex justify-between items-center mb-8 bg-slate-800 p-4 rounded-2xl shadow-xl border border-slate-700">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Dart Canlı Ligi</h1>
                <p class="text-xs text-slate-400">Ortak Canlı Veritabanı Aktif</p>
            </div>
            <span id="syncStatus" class="bg-amber-500/20 text-amber-400 text-xs px-3 py-1.5 rounded-full font-semibold border border-amber-500/30">Başlatılıyor...</span>
        </div>

        <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700 mb-6">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Yeni Oyuncu Ekle</h2>
            <div class="flex gap-2">
                <input id="playerName" type="text" placeholder="Oyuncu Adı" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm text-white focus:outline-none">
                <input id="playerNick" type="text" placeholder="Lakap" class="w-1/3 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm text-white focus:outline-none">
                <button onclick="addPlayer()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm">Ekle</button>
            </div>
        </div>

        <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700 mb-6">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Yeni Maç Kaydet</h2>
            <div class="grid grid-cols-7 gap-2 items-center">
                <select id="matchP1" class="col-span-2 bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none"></select>
                <input id="scoreP1" type="number" placeholder="Skor" class="col-span-1 bg-slate-900 border border-slate-700 rounded-xl p-2 text-center text-xs text-white focus:outline-none">
                <span class="col-span-1 text-center text-xs font-bold text-slate-500">VS</span>
                <input id="scoreP2" type="number" placeholder="Skor" class="col-span-1 bg-slate-900 border border-slate-700 rounded-xl p-2 text-center text-xs text-white focus:outline-none">
                <select id="matchP2" class="col-span-2 bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs text-white focus:outline-none"></select>
            </div>
            <button onclick="saveMatch()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-medium text-sm">Maçı Onayla ve Senkronize Et</button>
        </div>

        <div class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="p-4 bg-slate-800 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Canlı Sıralama</h2>
                <span id="playerCount" class="text-xs text-slate-500">0 Oyuncu</span>
            </div>
            <div id="leaderboard" class="divide-y divide-slate-700 max-h-80 overflow-y-auto"></div>
        </div>

        <div class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 overflow-hidden mt-6">
            <div class="p-4 bg-slate-800 border-b border-slate-700">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Son Maçlar</h2>
            </div>
            <div id="matchHistory" class="divide-y divide-slate-700 max-h-60 overflow-y-auto text-xs text-slate-400"></div>
        </div>

    </div>

    <script>
        const SUPABASE_URL = "https://unstztglzzfpxtoruwon.supabase.co";
        const SUPABASE_KEY = "sb_publishable_VIPMJRRlHqlXs3vdY2rGMw_KfU3kUOp";
        
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        let players = [];
        let history = [];

        async function loadData() {
            try {
                document.getElementById('syncStatus').innerText = "Yükleniyor...";
                let { data: dart_data, error } = await sb.from('dart_data').select('*');
                
                if (error) throw error;

                const dbPlayers = dart_data?.find(d => d.key === 'players');
                const dbHistory = dart_data?.find(d => d.key === 'history');

                players = dbPlayers ? dbPlayers.value : [];
                history = dbHistory ? dbHistory.value : [];
                
                document.getElementById('syncStatus').innerText = "Canlı";
                document.getElementById('syncStatus').className = "bg-emerald-500/20 text-emerald-400 text-xs px-3 py-1.5 rounded-full font-semibold border border-emerald-500/30";
                
                recalculateElo();
                renderAll();
            } catch (err) {
                document.getElementById('syncStatus').innerText = "Bağlantı Hatası";
                document.getElementById('syncStatus').className = "bg-red-500/20 text-red-400 text-xs px-3 py-1.5 rounded-full font-semibold border border-red-500/30";
                console.error("Yükleme Hatası:", err);
            }
        }

        async function pushData(key, value) {
            document.getElementById('syncStatus').innerText = "Eşitleniyor...";
            const { error } = await sb.from('dart_data').upsert({ key: key, value: value }, { onConflict: 'key' });
            if (error) {
                alert("Veritabanına yazılamadı! Detay: " + error.message);
                document.getElementById('syncStatus').innerText = "Hata";
                return false;
            }
            document.getElementById('syncStatus').innerText = "Canlı";
            return true;
        }

        async function addPlayer() {
            const name = document.getElementById('playerName').value.trim();
            const nick = document.getElementById('playerNick').value.trim();
            if (!name) return alert('Oyuncu adı boş bırakılamaz!');
            
            players.push({ id: "player_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5), name: name, nick: nick || '-', elo: 1000 });
            
            const success = await pushData('players', players);
            if (success) {
                document.getElementById('playerName').value = '';
                document.getElementById('playerNick').value = '';
                renderAll();
            } else {
                players.pop();
            }
        }

        async function deletePlayer(playerId) {
            const player = players.find(p => p.id === playerId);
            if (!player) return;

            const usedInMatches = history.some(m => m.p1Id === playerId || m.p2Id === playerId);
            if (usedInMatches) {
                alert("Bu oyuncunun maç geçmişi var. Önce oyuncunun maçlarını silmelisiniz.");
                return;
            }

            if (!confirm(`"${player.name}" isimli oyuncuyu silmek istediğinize emin misiniz?`)) return;

            players = players.filter(p => p.id !== playerId);
            await pushData('players', players);
            renderAll();
        }

        async function saveMatch() {
            const p1Id = document.getElementById('matchP1').value;
            const p2Id = document.getElementById('matchP2').value;
            const s1 = parseInt(document.getElementById('scoreP1').value);
            const s2 = parseInt(document.getElementById('scoreP2').value);

            if (!p1Id || !p2Id || p1Id === p2Id || isNaN(s1) || isNaN(s2)) return alert('Girişleri kontrol edin!');

            const p1 = players.find(p => p.id === p1Id);
            const p2 = players.find(p => p.id === p2Id);

            history.unshift({
                id: "match_" + Date.now() + "_" + Math.random().toString(36).substr(2, 5),
                p1Id: p1Id,
                p2Id: p2Id,
                p1Name: p1.name, 
                p2Name: p2.name, 
                s1: s1, 
                s2: s2,
                date: new Date().toLocaleDateString('tr-TR', {hour: '2-digit', minute:'2-digit'})
            });

            recalculateElo();

            const successPlayers = await pushData('players', players);
            const successHistory = await pushData('history', history);

            if (successPlayers && successHistory) {
                document.getElementById('scoreP1').value = '';
                document.getElementById('scoreP2').value = '';
                renderAll();
            } else {
                loadData();
            }
        }

        async function deleteMatch(matchId) {
            if (!confirm('Bu maçı silmek ve ELO puanlarını yeniden hesaplamak istediğinize emin misiniz?')) return;
            
            history = history.filter(m => m.id !== matchId);
            recalculateElo();

            const successPlayers = await pushData('players', players);
            const successHistory = await pushData('history', history);

            if (successPlayers && successHistory) {
                renderAll();
            } else {
                loadData();
            }
        }

        function recalculateElo() {
            players.forEach(p => p.elo = 1000);
            const chronologicalHistory = [...history].reverse();

            chronologicalHistory.forEach(m => {
                const p1 = players.find(p => p.id === m.p1Id);
                const p2 = players.find(p => p.id === m.p2Id);

                if (p1 && p2) {
                    const kFactor = 32;
                    const expectedP1 = 1 / (1 + Math.pow(10, (p2.elo - p1.elo) / 400));
                    const expectedP2 = 1 / (1 + Math.pow(10, (p1.elo - p2.elo) / 400));

                    let actualP1 = m.s1 > m.s2 ? 1 : (m.s1 < m.s2 ? 0 : 0.5);
                    let actualP2 = 1 - actualP1;

                    const changeP1 = Math.round(kFactor * (actualP1 - expectedP1));
                    const changeP2 = Math.round(kFactor * (actualP2 - expectedP2));

                    p1.elo += changeP1;
                    p2.elo += changeP2;

                    m.ch1 = changeP1 >= 0 ? `+${changeP1}` : changeP1;
                    m.ch2 = changeP2 >= 0 ? `+${changeP2}` : changeP2;
                }
            });
        }

        function renderAll() {
            const savedP1 = document.getElementById('matchP1').value;
            const savedP2 = document.getElementById('matchP2').value;

            const sortedPlayers = [...players].sort((a, b) => b.elo - a.elo);
            const leaderboard = document.getElementById('leaderboard');
            leaderboard.innerHTML = sortedPlayers.map((p, i) => `
                <div class="flex justify-between items-center p-4 hover:bg-slate-800/50 transition-colors">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold w-5 text-slate-500">${i + 1}.</span>
                        <div>
                            <div class="font-semibold text-sm text-white">${p.name}</div>
                            <div class="text-xs text-slate-400 italic">"${p.nick}"</div>
                        </div>
                    </div>
                    <div class="text-right flex items-center gap-3">
                        <div>
                            <span class="font-mono font-bold text-indigo-400 text-sm">${p.elo}</span>
                        </div>
                        <button onclick="deletePlayer('${p.id}')" class="text-red-400/60 hover:text-red-400 active:scale-90 transition-transform text-xs p-1">
                            ❌
                        </button>
                    </div>
                </div>
            `).join('');

            const options = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            document.getElementById('matchP1').innerHTML = '<option value="">Seç</option>' + options;
            document.getElementById('matchP2').innerHTML = '<option value="">Seç</option>' + options;
            document.getElementById('playerCount').innerText = `${players.length} Oyuncu`;

            if (savedP1) document.getElementById('matchP1').value = savedP1;
            if (savedP2) document.getElementById('matchP2').value = savedP2;

            document.getElementById('matchHistory').innerHTML = history.map(m => `
                <div class="p-3 flex justify-between items-center hover:bg-slate-800/40 transition-colors">
                    <div class="flex-1 text-sm">${m.p1Name} <span class="text-xs text-slate-500">(${m.ch1 || 0})</span></div>
                    <div class="bg-slate-900 px-3 py-1 rounded-lg font-mono text-xs font-bold mx-2 text-slate-300">${m.s1} - ${m.s2}</div>
                    <div class="flex-1 text-right text-sm">${m.p2Name} <span class="text-xs text-slate-500">(${m.ch2 || 0})</span></div>
                    <button onclick="deleteMatch('${m.id}')" class="ml-3 text-red-400/60 hover:text-red-400 active:scale-90 transition-transform text-xs">
                        🗑
                    </button>
                </div>
            `).join('');
        }

        loadData();

        sb.channel('dart-live')
            .on(
                'postgres_changes',
                {
                    event: '*',
                    schema: 'public',
                    table: 'dart_data'
                },
                () => {
                    loadData();
                }
            )
            .subscribe();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dart ELO Ligi</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen pb-12">

    <!-- Mobil Kapsayıcı -->
    <div class="max-w-md mx-auto px-4 pt-6">
        
        <!-- Header -->
        <div class="flex justify-between items-center mb-8 bg-slate-800 p-4 rounded-2xl shadow-xl border border-slate-700">
            <div>
                <h1 class="text-2xl font-bold tracking-tight text-white">Dart ELO Ligi</h1>
                <p class="text-xs text-slate-400">Cricket / 501 Rekabet Yönetimi</p>
            </div>
            <span class="bg-indigo-500/20 text-indigo-400 text-xs px-3 py-1.5 rounded-full font-semibold border border-indigo-500/30">v1.0</span>
        </div>

        <!-- Oyuncu Ekleme Formu -->
        <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700 mb-6">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-3">Yeni Oyuncu Ekle</h2>
            <div class="flex gap-2">
                <input id="playerName" type="text" placeholder="Oyuncu Adı" class="flex-1 bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
                <input id="playerNick" type="text" placeholder="Lakap" class="w-1/3 bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-indigo-500 text-white">
                <button onclick="addPlayer()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-4 py-2.5 rounded-xl font-medium text-sm transition-all shadow-md active:scale-95">Ekle</button>
            </div>
        </div>

        <!-- Maç Kaydetme Formu -->
        <div class="bg-slate-800 p-5 rounded-2xl shadow-lg border border-slate-700 mb-6">
            <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400 mb-4">Yeni Maç Kaydet</h2>
            
            <div class="grid grid-cols-7 gap-2 items-center">
                <!-- P1 -->
                <select id="matchP1" class="col-span-2 bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs focus:outline-none text-white"></select>
                <input id="scoreP1" type="number" placeholder="Skor" class="col-span-1 bg-slate-900 border border-slate-700 rounded-xl p-2 text-center text-xs focus:outline-none text-white">
                
                <!-- VS -->
                <span class="col-span-1 text-center text-xs font-bold text-slate-500">VS</span>
                
                <!-- P2 -->
                <input id="scoreP2" type="number" placeholder="Skor" class="col-span-1 bg-slate-900 border border-slate-700 rounded-xl p-2 text-center text-xs focus:outline-none text-white">
                <select id="matchP2" class="col-span-2 bg-slate-900 border border-slate-700 rounded-xl p-2 text-xs focus:outline-none text-white"></select>
            </div>
            
            <button onclick="saveMatch()" class="w-full mt-4 bg-emerald-600 hover:bg-emerald-500 text-white py-2.5 rounded-xl font-medium text-sm transition-all shadow-md active:scale-95">Maçı Onayla ve ELO Hesapla</button>
        </div>

        <!-- Liderlik Tablosu (Sıralama) -->
        <div class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 overflow-hidden">
            <div class="p-4 bg-slate-750 border-b border-slate-700 flex justify-between items-center">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Liderlik Tablosu</h2>
                <span id="playerCount" class="text-xs text-slate-500">0 Oyuncu</span>
            </div>
            <div id="leaderboard" class="divide-y divide-slate-700 max-h-80 overflow-y-auto">
                <!-- Dinamik Oyuncular -->
            </div>
        </div>

        <!-- Maç Geçmişi -->
        <div class="bg-slate-800 rounded-2xl shadow-lg border border-slate-700 overflow-hidden mt-6">
            <div class="p-4 bg-slate-750 border-b border-slate-700">
                <h2 class="text-sm font-semibold uppercase tracking-wider text-slate-400">Son Maçlar</h2>
            </div>
            <div id="matchHistory" class="divide-y divide-slate-700 max-h-60 overflow-y-auto text-xs text-slate-400">
                <!-- Dinamik Maçlar -->
            </div>
        </div>

        <!-- Verileri Sıfırla -->
        <div class="mt-8 text-center">
            <button onclick="resetData()" class="text-xs text-slate-600 hover:text-red-400 transition-colors underline decoration-dotted">Tüm Lig Verilerini Sıfırla</button>
        </div>

    </div>

    <!-- Uygulama Mantığı (JavaScript) -->
    <script>
        let players = JSON.parse(localStorage.getItem('dart_players')) || [];
        let history = JSON.parse(localStorage.getItem('dart_history')) || [];

        function updateStorage() {
            localStorage.setItem('dart_players', JSON.stringify(players));
            localStorage.setItem('dart_history', JSON.stringify(history));
            renderAll();
        }

        function addPlayer() {
            const name = document.getElementById('playerName').value.trim();
            const nick = document.getElementById('playerNick').value.trim();
            
            if (!name) return alert('Oyuncu adı boş bırakılamaz!');
            
            players.push({
                id: Date.now().toString(),
                name: name,
                nick: nick || '-',
                elo: 1000
            });

            document.getElementById('playerName').value = '';
            document.getElementById('playerNick').value = '';
            updateStorage();
        }

        function saveMatch() {
            const p1Id = document.getElementById('matchP1').value;
            const p2Id = document.getElementById('matchP2').value;
            const s1 = parseInt(document.getElementById('scoreP1').value);
            const s2 = parseInt(document.getElementById('scoreP2').value);

            if (!p1Id || !p2Id) return alert('Lütfen iki oyuncu seçin!');
            if (p1Id === p2Id) return alert('Bir oyuncu kendisiyle maç yapamaz!');
            if (isNaN(s1) || isNaN(s2)) return alert('Geçerli skorları giriniz!');

            const p1 = players.find(p => p.id === p1Id);
            const p2 = players.find(p => p.id === p2Id);

            // ELO Algoritması
            const kFactor = 32;
            const expectedP1 = 1 / (1 + Math.pow(10, (p2.elo - p1.elo) / 400));
            const expectedP2 = 1 / (1 + Math.pow(10, (p1.elo - p2.elo) / 400));

            let actualP1 = 0.5;
            if (s1 > s2) actualP1 = 1;
            if (s1 < s2) actualP1 = 0;
            let actualP2 = 1 - actualP1;

            const changeP1 = Math.round(kFactor * (actualP1 - expectedP1));
            const changeP2 = Math.round(kFactor * (actualP2 - expectedP2));

            // Güncelleme
            p1.elo += changeP1;
            p2.elo += changeP2;

            history.unshift({
                date: new Date().toLocaleDateString('tr-TR', {hour: '2-digit', minute:'2-digit'}),
                p1Name: p1.name,
                p2Name: p2.name,
                s1: s1,
                s2: s2,
                ch1: changeP1 >= 0 ? `+${changeP1}` : changeP1,
                ch2: changeP2 >= 0 ? `+${changeP2}` : changeP2
            });

            document.getElementById('scoreP1').value = '';
            document.getElementById('scoreP2').value = '';
            updateStorage();
        }

        function renderAll() {
            // Sıralama
            players.sort((a, b) => b.elo - a.elo);
            
            const leaderboard = document.getElementById('leaderboard');
            leaderboard.innerHTML = players.map((p, i) => `
                <div class="flex justify-between items-center p-4 hover:bg-slate-750 transition-colors">
                    <div class="flex items-center gap-3">
                        <span class="text-xs font-bold w-5 text-slate-500">${i + 1}.</span>
                        <div>
                            <div class="font-semibold text-sm text-white">${p.name}</div>
                            <div class="text-xs text-slate-400 italic">"${p.nick}"</div>
                        </div>
                    </div>
                    <div class="text-right">
                        <span class="font-mono font-bold text-indigo-400 text-sm">${p.elo}</span>
                        <p class="text-[10px] text-slate-500">ELO</p>
                    </div>
                </div>
            `).join('');

            if(players.length === 0) {
                leaderboard.innerHTML = `<p class="p-4 text-xs text-slate-500 text-center">Henüz oyuncu eklenmemiş.</p>`;
            }

            // Seçim Kutuları
            const select1 = document.getElementById('matchP1');
            const select2 = document.getElementById('matchP2');
            const options = players.map(p => `<option value="${p.id}">${p.name}</option>`).join('');
            
            const saved1 = select1.value;
            const saved2 = select2.value;
            
            select1.innerHTML = '<option value="">Oyuncu Seç</option>' + options;
            select2.innerHTML = '<option value="">Oyuncu Seç</option>' + options;
            
            if(saved1) select1.value = saved1;
            if(saved2) select2.value = saved2;

            // Sayaç
            document.getElementById('playerCount').innerText = `${players.length} Oyuncu`;

            // Maç geçmişi
            const historyDiv = document.getElementById('matchHistory');
            historyDiv.innerHTML = history.map(m => `
                <div class="p-3 bg-slate-800/50 flex justify-between items-center">
                    <div class="flex-1">
                        <span class="text-white font-medium">${m.p1Name}</span> 
                        <span class="text-slate-500">(${m.ch1})</span>
                    </div>
                    <div class="bg-slate-900 px-3 py-1 rounded-lg font-mono text-sm font-bold text-slate-300 mx-2">
                        ${m.s1} - ${m.s2}
                    </div>
                    <div class="flex-1 text-right">
                        <span class="text-white font-medium">${m.p2Name}</span> 
                        <span class="text-slate-500">(${m.ch2})</span>
                    </div>
                </div>
            `).join('');
            
            if(history.length === 0) {
                historyDiv.innerHTML = `<p class="p-4 text-xs text-slate-500 text-center">Henüz maç kaydı yok.</p>`;
            }
        }

        function resetData() {
            if (confirm('Tüm ligi, oyuncuları ve geçmişi sıfırlamak istediğinize emin misiniz?')) {
                players = [];
                history = [];
                updateStorage();
            }
        }

        // İlk Çalıştırma
        renderAll();
    </script>
</body>
</html>
